<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hand Writing Pen</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        var root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<div style="color:#F5D061; background:#050301; padding:40px; font-family:serif; height:100vh;">' +
            '<h2>Something went wrong</h2>' +
            '<p style="opacity:0.8;">' + msg + '</p>' +
            '<p style="font-size:0.8rem; opacity:0.5;">Line: ' + lineNo + ' | Col: ' + columnNo + '</p>' +
            '<button onclick="location.reload()" style="margin-top:20px; background:#F5D061; border:none; padding:10px 20px; cursor:pointer;">Refresh</button>' +
            '</div>';
        }
        return false;
      };
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
